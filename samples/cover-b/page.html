<!DOCTYPE html>
<!-- samples/cover-b/page.html (DS-12 variant B): factory pilot cover as a
     1080x1080 square-fill listing. Same title/offer as samples/cover variant A
     (1280x720), reflowed for the square slot: stacked proof bar, full-bleed
     accent foot, 96px title = 22.8px at 256px. Color only via tokens.css. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    background: var(--paper); color: var(--ink);
    font-family: var(--font-body);
    display: block;
  }
  .cover {
    width: 1080px; height: 1080px;
    display: flex; flex-direction: column;
    text-align: center;
  }
  .top-rule { height: 12px; background: var(--accent); }
  .main {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 48px 86px 40px;
    border-block-end: 2px solid var(--line);
  }
  .kicker { font-size: 30px; letter-spacing: 8px; color: var(--accent); font-family: var(--font-body); margin-block-end: 26px; }
  h1 { font-family: var(--font-display); font-size: 96px; line-height: 1.05; color: var(--ink); margin-block-end: 24px; }
  .sub { font-size: 36px; color: var(--muted); margin-block-end: 48px; }
  .cta { display: inline-block; font-size: 36px; font-weight: bold; color: var(--on-accent); background: var(--accent); padding: 24px 72px; border-radius: 14px; }
  .proof {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px;
    padding: 32px 64px 36px; text-align: center;
  }
  .proof strong { display: block; font-family: var(--font-display); font-size: 40px; color: var(--ink); }
  .proof span { font-size: 24px; color: var(--muted); }
  .foot {
    background: var(--accent); color: var(--on-accent);
    font-size: 26px; letter-spacing: 4px;
    padding: 22px 16px 24px;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="top-rule"></div>
    <div class="main">
      <div class="kicker">FACTORY PILOT COVER</div>
      <h1>DESIGN THAT SHIPS</h1>
      <p class="sub">Brief to rendered, audited pixels. No human in the loop.</p>
      <span class="cta">Render it again</span>
    </div>
    <div class="proof">
      <div><strong>256px</strong><span>thumb legible</span></div>
      <div><strong>315px</strong><span>listing width</span></div>
      <div><strong>Judged</strong><span>before it ships</span></div>
    </div>
    <div class="foot">FACTORY COVER &#8226; 1080 &#215; 1080</div>
  </div>
</body>
</html>
