<!DOCTYPE html>
<!-- designs/O-015/page.html: O-015 itch.io cover for Medieval Warriors Vol 4 (epic). Facts only from medieval-warriors-vol4/itch.md. Color only via tokens.css. 1280x720 hero above 800px wide, 630x500 store card at 800px and below. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  .stage { position: relative; display: flex; width: 100%; height: 100%; overflow: hidden; background: var(--stage-bg, var(--bg)); }
  .copy { position: relative; z-index: 3; flex: 0 0 var(--copy-w, 52%); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-inline-start: var(--pad, 72px); padding-block: 48px; }
  .art { position: relative; z-index: 1; flex: 1; }
  .kicker { font-weight: 800; font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 16px; }
  h1 { text-wrap: balance; font-family: var(--font-display); font-weight: var(--title-weight, 800); font-size: var(--title-px, 104px); line-height: 0.96; letter-spacing: var(--title-track, -0.01em); color: var(--ink); margin-bottom: 22px; }
  .claim { text-wrap: balance; font-size: var(--claim-px, 32px); line-height: 1.2; color: var(--muted); font-weight: 600; margin-bottom: 26px; max-width: var(--claim-w, 560px); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin-bottom: 28px; max-width: var(--claim-w, 560px); }
  .chips li { font-size: 21px; font-weight: 700; line-height: 1.1; padding: 9px 14px; border-radius: var(--chip-r, 8px); background: var(--chip-bg); color: var(--chip-ink); border: 2px solid var(--chip-line); }
  .cta { font-size: 30px; font-weight: 800; line-height: 1; padding: 15px 30px; border-radius: var(--chip-r, 8px); background: var(--accent); color: var(--on-accent); }
  .fine { margin-top: 16px; font-size: 19px; color: var(--muted); max-width: var(--claim-w, 560px); }
  .win { position: absolute; border-radius: 10px; overflow: hidden; background: var(--win-bg, var(--ink)); box-shadow: 0 24px 48px rgba(0, 0, 0, 0.28), 0 3px 8px rgba(0, 0, 0, 0.22); }
  .win::before { content: ""; display: block; height: 22px; background: var(--win-bar, var(--ink)); border-bottom: 3px solid var(--accent); }
  .win img { display: block; width: 100%; }
  .win .vp { position: relative; overflow: hidden; }
  .win .vp img { position: absolute; max-width: none; }
  @media (max-width: 800px) {
    .stage { flex-direction: column; }
    .copy { flex: 0 0 auto; padding-inline: var(--pad-card, 26px); padding-block: var(--pad-top-card, 22px) 0; }
    .kicker { font-size: 14px; margin-bottom: 8px; }
    h1 { font-size: var(--title-px-card, 60px); margin-bottom: 8px; }
    .claim { font-size: var(--claim-px-card, 21px); margin-bottom: 12px; max-width: none; }
    .chips { gap: 6px; margin-bottom: 0; max-width: none; }
    .chips li { font-size: 14px; padding: 5px 9px; border-width: 1.5px; }
    .chips li.wide-only { display: none; }
    .cta { font-size: 19px; padding: 9px 18px; }
    .fine { display: none; }
    .art { flex: 1; min-height: 0; }
  }
  .stage { background: linear-gradient(180deg, var(--bg) 0%, var(--bg) 38%, var(--bg-2) 100%); }
  h1 { text-transform: uppercase; }
  .art .moon { position: absolute; width: 420px; height: 420px; border-radius: 50%; background: var(--moon); opacity: 0.16; inset-inline-start: 110px; top: 70px; }
  .art .ground { position: absolute; inset-inline: 0; bottom: 0; height: 150px; background: var(--ground); border-top: 4px solid var(--accent); }
  .art .spr { position: absolute; image-rendering: pixelated; width: 512px; height: 512px; bottom: 120px; }
  .art .kni { inset-inline-start: 62px; z-index: 3; }
  .art .foot { inset-inline-start: -118px; width: 448px; height: 448px; bottom: 132px; z-index: 2; filter: brightness(0.85); }
  .art .arch { inset-inline-start: 262px; width: 448px; height: 448px; bottom: 132px; z-index: 2; filter: brightness(0.85); }
  .art .dirs { position: absolute; inset-inline: 0; bottom: 14px; display: flex; justify-content: center; z-index: 4; }
  .art .dirs img { width: 88px; height: 88px; image-rendering: pixelated; margin-inline: -6px; }
  @media (max-width: 800px) {
    .art .moon { width: 240px; height: 240px; inset-inline-start: 190px; top: 10px; }
    .art .ground { height: 84px; border-top-width: 3px; }
    .art .spr { width: 216px; height: 216px; bottom: 60px; }
    .art .kni { inset-inline-start: 207px; }
    .art .foot { inset-inline-start: 40px; width: 200px; height: 200px; bottom: 68px; }
    .art .arch { inset-inline-start: 390px; width: 200px; height: 200px; bottom: 68px; }
    .art .dirs { bottom: 4px; }
    .art .dirs img { width: 60px; height: 60px; margin-inline: -4px; }
  }
</style>
</head>
<body data-oid="cover.hero">
<div class="stage">
  <div class="copy">
    <div class="kicker">Pixel sprite pack</div>
    <h1 data-oid="cover.title">Medieval Warriors Vol 4</h1>
    <p class="claim" data-oid="cover.subtitle">True 8-direction sprite sheets, plain PNG</p>
    <ul class="chips"><li>3 warriors</li><li>5 actions x 8 directions</li><li>432 frames</li><li>Playable browser demo</li></ul>
    <span class="cta" data-oid="cover.cta">$29 one-time</span>
  </div>
  <div class="art">
    <div class="moon"></div>
    <div class="ground"></div>
    <img class="spr arch" src="assets/archer.png" alt="Archer sprite">
    <img class="spr foot" src="assets/footman.png" alt="Footman sprite">
    <img class="spr kni" src="assets/knight.png" alt="Knight sprite">
    <div class="dirs">
      <img src="assets/walk-s.png" alt="S"><img src="assets/walk-se.png" alt="SE"><img src="assets/walk-e.png" alt="E"><img src="assets/walk-ne.png" alt="NE"><img src="assets/walk-n.png" alt="N"><img src="assets/walk-nw.png" alt="NW"><img src="assets/walk-w.png" alt="W"><img src="assets/walk-sw.png" alt="SW">
    </div>

  </div>
</div>
</body>
</html>
