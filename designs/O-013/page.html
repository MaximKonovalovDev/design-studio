<!DOCTYPE html>
<!-- designs/O-013/page.html: O-013 Gumroad cover for Keyword Steroids 70 (clean-professional). Facts only from keyword-steroids-70/gumroad.md. Color only via tokens.css. 1280x720 hero above 800px wide, 630x500 store card at 800px and below. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  .stage { position: relative; display: flex; width: 100%; height: 100%; overflow: hidden; background: var(--stage-bg, var(--bg)); }
  .copy { position: relative; z-index: 3; flex: 0 0 var(--copy-w, 52%); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-inline-start: var(--pad, 72px); padding-block: 48px; }
  .art { position: relative; z-index: 1; flex: 1; }
  .kicker { font-weight: 800; font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 16px; }
  h1 { text-wrap: balance; font-family: var(--font-display); font-weight: var(--title-weight, 800); font-size: var(--title-px, 104px); line-height: 0.96; letter-spacing: var(--title-track, -0.01em); color: var(--ink); margin-bottom: 22px; }
  .claim { text-wrap: balance; font-size: var(--claim-px, 32px); line-height: 1.2; color: var(--muted); font-weight: 600; margin-bottom: 26px; max-width: var(--claim-w, 560px); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin-bottom: 28px; max-width: var(--claim-w, 560px); }
  .chips li { font-size: 21px; font-weight: 700; line-height: 1.1; padding: 9px 14px; border-radius: var(--chip-r, 8px); background: var(--chip-bg); color: var(--chip-ink); border: 2px solid var(--chip-line); }
  .cta { font-size: 30px; font-weight: 800; line-height: 1; padding: 15px 30px; border-radius: var(--chip-r, 8px); background: var(--accent); color: var(--on-accent); }
  .fine { margin-top: 16px; font-size: 19px; color: var(--muted); max-width: var(--claim-w, 560px); }
  .win { position: absolute; border-radius: 10px; overflow: hidden; background: var(--win-bg, var(--ink)); box-shadow: 0 24px 48px rgba(0, 0, 0, 0.28), 0 3px 8px rgba(0, 0, 0, 0.22); }
  .win::before { content: ""; display: block; height: 22px; background: var(--win-bar, var(--ink)); border-bottom: 3px solid var(--accent); }
  .win img { display: block; width: 100%; }
  .win .vp { position: relative; overflow: hidden; }
  .win .vp img { position: absolute; max-width: none; }
  @media (max-width: 800px) {
    .stage { flex-direction: column; }
    .copy { flex: 0 0 auto; padding-inline: var(--pad-card, 26px); padding-block: var(--pad-top-card, 22px) 0; }
    .kicker { font-size: 14px; margin-bottom: 8px; }
    h1 { font-size: var(--title-px-card, 60px); margin-bottom: 8px; }
    .claim { font-size: var(--claim-px-card, 21px); margin-bottom: 12px; max-width: none; }
    .chips { gap: 6px; margin-bottom: 0; max-width: none; }
    .chips li { font-size: 14px; padding: 5px 9px; border-width: 1.5px; }
    .chips li.wide-only { display: none; }
    .cta { font-size: 19px; padding: 9px 18px; }
    .fine { display: none; }
    .art { flex: 1; min-height: 0; }
  }
  .stage { background: linear-gradient(135deg, var(--bg) 0%, var(--bg) 40%, var(--bg-2) 100%); }
  .art .grid { position: absolute; inset: 0; background-image: linear-gradient(var(--bg-2) 1px, transparent 1px), linear-gradient(90deg, var(--bg-2) 1px, transparent 1px); background-size: 48px 48px; opacity: 0.8; }
  .art .win.a { width: 600px; inset-inline-start: 6px; top: 96px; transform: rotate(-1.5deg); border: 3px solid var(--ink); }
  .art .win.a .vp { height: 330px; }
  .art .win.a .vp img { width: 720px; top: 0; inset-inline-start: 0; }
  .art .stat { position: absolute; background: var(--accent); color: var(--on-accent); font-size: 20px; font-weight: 700; padding: 10px 16px; border-radius: 8px; box-shadow: 0 10px 24px rgba(18, 19, 31, 0.28); line-height: 1.1; }
  .art .stat b { display: block; font-family: var(--font-display); font-size: 62px; line-height: 0.95; }
  .art .s1 { inset-inline-start: 40px; top: 470px; transform: rotate(-3deg); }
  .art .s2 { inset-inline-start: 250px; top: 500px; transform: rotate(2deg); background: var(--violet); }
  .art .s3 { inset-inline-start: 420px; top: 456px; transform: rotate(-2deg); background: var(--ink); }
  @media (max-width: 800px) {
    .art .grid { background-size: 32px 32px; }
    .art .win.a { width: 360px; inset-inline-start: 14px; top: 22px; border-width: 2px; }
    .art .win.a .vp { height: 170px; }
    .art .win.a .vp img { width: 432px; }
    .art .stat { font-size: 13px; padding: 6px 10px; }
    .art .stat b { font-size: 32px; }
    .art .s1 { inset-inline-start: 390px; top: 20px; }
    .art .s2 { inset-inline-start: 400px; top: 108px; }
    .art .s3 { inset-inline-start: 300px; top: 190px; }
  }
</style>
</head>
<body data-oid="cover.hero">
<div class="stage">
  <div class="copy">
    <div class="kicker">Keyword research tool</div>
    <h1 data-oid="cover.title">Keyword Steroids 70</h1>
    <p class="claim" data-oid="cover.subtitle">70 SEO keyword picks plus People-Also-Ask clusters</p>
    <ul class="chips"><li>7 clusters</li><li>35 PAA questions</li><li>CSV export</li><li>Offline browser app</li><li>No API key</li></ul>
    <span class="cta" data-oid="cover.cta">$19 one-time</span>
  </div>
  <div class="art">
    <div class="grid"></div>
    <div class="win a"><div class="vp"><img src="assets/app.png" alt="Keyword Steroids 70 running in a browser"></div></div>
    <div class="stat s1"><b>70</b>keywords</div>
    <div class="stat s2"><b>7</b>clusters</div>
    <div class="stat s3"><b>35</b>PAA questions</div>

  </div>
</div>
</body>
</html>
