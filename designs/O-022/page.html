<!DOCTYPE html>
<!-- designs/O-022/page.html: O-022 itch.io cover for UI Component Kit Generator (clean-modern). Facts only from ui-component-kit-generator/itch.md. Color only via tokens.css. 1280x720 hero above 800px wide, 630x500 store card at 800px and below. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  .stage { position: relative; display: flex; width: 100%; height: 100%; overflow: hidden; background: var(--stage-bg, var(--bg)); }
  .copy { position: relative; z-index: 3; flex: 0 0 var(--copy-w, 52%); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-inline-start: var(--pad, 72px); padding-block: 48px; }
  .art { position: relative; z-index: 1; flex: 1; }
  .kicker { font-weight: 800; font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 16px; }
  h1 { text-wrap: balance; font-family: var(--font-display); font-weight: var(--title-weight, 800); font-size: var(--title-px, 104px); line-height: 0.96; letter-spacing: var(--title-track, -0.01em); color: var(--ink); margin-bottom: 22px; }
  .claim { text-wrap: balance; font-size: var(--claim-px, 32px); line-height: 1.2; color: var(--muted); font-weight: 600; margin-bottom: 26px; max-width: var(--claim-w, 560px); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin-bottom: 28px; max-width: var(--claim-w, 560px); }
  .chips li { font-size: 21px; font-weight: 700; line-height: 1.1; padding: 9px 14px; border-radius: var(--chip-r, 8px); background: var(--chip-bg); color: var(--chip-ink); border: 2px solid var(--chip-line); }
  .cta { font-size: 30px; font-weight: 800; line-height: 1; padding: 15px 30px; border-radius: var(--chip-r, 8px); background: var(--accent); color: var(--on-accent); }
  .fine { margin-top: 16px; font-size: 19px; color: var(--muted); max-width: var(--claim-w, 560px); }
  .win { position: absolute; border-radius: 10px; overflow: hidden; background: var(--win-bg, var(--ink)); box-shadow: 0 24px 48px rgba(0, 0, 0, 0.28), 0 3px 8px rgba(0, 0, 0, 0.22); }
  .win::before { content: ""; display: block; height: 22px; background: var(--win-bar, var(--ink)); border-bottom: 3px solid var(--accent); }
  .win img { display: block; width: 100%; }
  .win .vp { position: relative; overflow: hidden; }
  .win .vp img { position: absolute; max-width: none; }
  @media (max-width: 800px) {
    .stage { flex-direction: column; }
    .copy { flex: 0 0 auto; padding-inline: var(--pad-card, 26px); padding-block: var(--pad-top-card, 22px) 0; }
    .kicker { font-size: 14px; margin-bottom: 8px; }
    h1 { font-size: var(--title-px-card, 60px); margin-bottom: 8px; }
    .claim { font-size: var(--claim-px-card, 21px); margin-bottom: 12px; max-width: none; }
    .chips { gap: 6px; margin-bottom: 0; max-width: none; }
    .chips li { font-size: 14px; padding: 5px 9px; border-width: 1.5px; }
    .chips li.wide-only { display: none; }
    .cta { font-size: 19px; padding: 9px 18px; }
    .fine { display: none; }
    .art { flex: 1; min-height: 0; }
  }
  .stage { background: linear-gradient(145deg, var(--bg) 0%, var(--bg-2) 100%); }
  .art .glow { position: absolute; width: 520px; height: 520px; border-radius: 50%; background: var(--accent); opacity: 0.25; inset-inline-end: -140px; top: 120px; }
  .art .t { position: absolute; width: 316px; height: auto; background: var(--paper); border-radius: 10px; box-shadow: 0 16px 34px rgba(0, 0, 0, 0.45); }
  .art .t1 { inset-inline-start: 24px; top: 120px; transform: rotate(-3deg); }
  .art .t2 { inset-inline-start: 316px; top: 98px; transform: rotate(2deg); }
  .art .t3 { inset-inline-start: 10px; top: 236px; transform: rotate(2deg); }
  .art .t4 { inset-inline-start: 306px; top: 218px; transform: rotate(-2deg); }
  .art .t5 { inset-inline-start: 28px; top: 350px; transform: rotate(-2deg); }
  .art .t6 { inset-inline-start: 312px; top: 340px; transform: rotate(3deg); }
  .art .t7 { inset-inline-start: 14px; top: 466px; transform: rotate(3deg); }
  .art .t8 { inset-inline-start: 308px; top: 460px; transform: rotate(-2deg); }
  .art .big { position: absolute; inset-inline-end: 24px; top: -24px; font-family: var(--font-display); font-weight: 900; font-size: 130px; line-height: 1; letter-spacing: -0.05em; color: var(--accent-ink); }
  @media (max-width: 800px) {
    .art .glow { width: 300px; height: 300px; }
    .art .t { width: 190px; border-radius: 7px; }
    .art .t1 { inset-inline-start: 14px; top: 14px; } .art .t2 { inset-inline-start: 214px; top: 6px; } .art .t3 { inset-inline-start: 414px; top: 18px; }
    .art .t4 { inset-inline-start: 18px; top: 108px; } .art .t5 { inset-inline-start: 218px; top: 100px; } .art .t6 { inset-inline-start: 418px; top: 112px; }
    .art .t7, .art .t8 { display: none; }
    .art .big { display: none; }
  }
</style>
</head>
<body data-oid="cover.hero">
<div class="stage">
  <div class="copy">
    <div class="kicker">Generate your brand UI kit</div>
    <h1 data-oid="cover.title">UI Component Kit Generator</h1>
    <p class="claim" data-oid="cover.subtitle">201 components. 45 landing pages. Your brand.</p>
    <ul class="chips"><li>201 SVG components</li><li>45 landing pages</li><li>35 HubSpot modules</li><li class="wide-only">Tokens Studio ready</li></ul>
    <span class="cta" data-oid="cover.cta">$29 launch sale</span>
  </div>
  <div class="art">
    <div class="glow"></div>
    <img class="t t1" src="assets/alerts-01.svg" alt="alerts-01 component">
    <img class="t t2" src="assets/badges-01.svg" alt="badges-01 component">
    <img class="t t3" src="assets/buttons-02.svg" alt="buttons-02 component">
    <img class="t t4" src="assets/cards-01.svg" alt="cards-01 component">
    <img class="t t5" src="assets/forms-01.svg" alt="forms-01 component">
    <img class="t t6" src="assets/inputs-01.svg" alt="inputs-01 component">
    <img class="t t7" src="assets/modals-01.svg" alt="modals-01 component">
    <img class="t t8" src="assets/navbars-01.svg" alt="navbars-01 component">
    <div class="big">201</div>

  </div>
</div>
</body>
</html>
