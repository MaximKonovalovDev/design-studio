<!DOCTYPE html>
<!-- designs/O-021/page.html: O-021 itch.io cover for AEO Visibility Mini-Check (friendly). Facts only from listing/itch-free.md. Color only via tokens.css. 1280x720 hero above 800px wide, 630x500 store card at 800px and below. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  .stage { position: relative; display: flex; width: 100%; height: 100%; overflow: hidden; background: var(--stage-bg, var(--bg)); }
  .copy { position: relative; z-index: 3; flex: 0 0 var(--copy-w, 52%); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-inline-start: var(--pad, 72px); padding-block: 48px; }
  .art { position: relative; z-index: 1; flex: 1; }
  .kicker { font-weight: 800; font-size: 22px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 16px; }
  h1 { text-wrap: balance; font-family: var(--font-display); font-weight: var(--title-weight, 800); font-size: var(--title-px, 104px); line-height: 0.96; letter-spacing: var(--title-track, -0.01em); color: var(--ink); margin-bottom: 22px; }
  .claim { text-wrap: balance; font-size: var(--claim-px, 32px); line-height: 1.2; color: var(--muted); font-weight: 600; margin-bottom: 26px; max-width: var(--claim-w, 560px); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin-bottom: 28px; max-width: var(--claim-w, 560px); }
  .chips li { font-size: 21px; font-weight: 700; line-height: 1.1; padding: 9px 14px; border-radius: var(--chip-r, 8px); background: var(--chip-bg); color: var(--chip-ink); border: 2px solid var(--chip-line); }
  .cta { font-size: 30px; font-weight: 800; line-height: 1; padding: 15px 30px; border-radius: var(--chip-r, 8px); background: var(--accent); color: var(--on-accent); }
  .fine { margin-top: 16px; font-size: 19px; color: var(--muted); max-width: var(--claim-w, 560px); }
  .win { position: absolute; border-radius: 10px; overflow: hidden; background: var(--win-bg, var(--ink)); box-shadow: 0 24px 48px rgba(0, 0, 0, 0.28), 0 3px 8px rgba(0, 0, 0, 0.22); }
  .win::before { content: ""; display: block; height: 22px; background: var(--win-bar, var(--ink)); border-bottom: 3px solid var(--accent); }
  .win img { display: block; width: 100%; }
  .win .vp { position: relative; overflow: hidden; }
  .win .vp img { position: absolute; max-width: none; }
  @media (max-width: 800px) {
    .stage { flex-direction: column; }
    .copy { flex: 0 0 auto; padding-inline: var(--pad-card, 26px); padding-block: var(--pad-top-card, 22px) 0; }
    .kicker { font-size: 14px; margin-bottom: 8px; }
    h1 { font-size: var(--title-px-card, 60px); margin-bottom: 8px; }
    .claim { font-size: var(--claim-px-card, 21px); margin-bottom: 12px; max-width: none; }
    .chips { gap: 6px; margin-bottom: 0; max-width: none; }
    .chips li { font-size: 14px; padding: 5px 9px; border-width: 1.5px; }
    .chips li.wide-only { display: none; }
    .cta { font-size: 19px; padding: 9px 18px; }
    .fine { display: none; }
    .art { flex: 1; min-height: 0; }
  }
  .stage { background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%); }
  .art .blob { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: var(--sun); opacity: 0.6; inset-inline-end: -110px; top: 30px; }
  .art .paper { position: absolute; width: 600px; inset-inline-start: 6px; top: 118px; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 10px 10px 0 var(--ink); transform: rotate(-2deg); overflow: hidden; }
  .art .vp { position: relative; height: 350px; overflow: hidden; }
  .art .vp img { position: absolute; width: 690px; max-width: none; top: -104px; inset-inline-start: -20px; }
  .art .free { position: absolute; inset-inline-end: 26px; top: 26px; z-index: 3; font-family: var(--font-display); font-weight: 900; font-size: 92px; line-height: 1; letter-spacing: -0.02em; color: var(--ink); background: var(--sun); padding: 8px 26px 12px; border: 4px solid var(--ink); border-radius: 14px; box-shadow: 6px 6px 0 var(--ink); transform: rotate(5deg); }
  .art .n { position: absolute; z-index: 3; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 22px; line-height: 1; padding: 10px 18px 12px; border-radius: 10px; text-align: center; box-shadow: 6px 6px 0 var(--ink); }
  .art .n b { display: block; font-family: var(--font-display); font-size: 64px; line-height: 0.95; }
  .art .n1 { inset-inline-start: 30px; top: 520px; transform: rotate(-4deg); }
  .art .n2 { inset-inline-start: 190px; top: 540px; transform: rotate(3deg); }
  @media (max-width: 800px) {
    .art .blob { width: 280px; height: 280px; top: -10px; }
    .art .paper { width: 380px; inset-inline-start: 14px; top: 20px; border-width: 2px; box-shadow: 6px 6px 0 var(--ink); }
    .art .vp { height: 190px; }
    .art .vp img { width: 440px; top: -68px; inset-inline-start: -12px; }
    .art .free { font-size: 52px; padding: 4px 16px 6px; border-width: 3px; top: -6px; inset-inline-end: 24px; box-shadow: 4px 4px 0 var(--ink); }
    .art .n { font-size: 14px; padding: 6px 12px 8px; box-shadow: 4px 4px 0 var(--ink); }
    .art .n b { font-size: 36px; }
    .art .n1 { inset-inline-start: 424px; top: 92px; }
    .art .n2 { inset-inline-start: 524px; top: 108px; }
  }
</style>
</head>
<body data-oid="cover.hero">
<div class="stage">
  <div class="copy">
    <div class="kicker">Free sampler of the audit kit</div>
    <h1 data-oid="cover.title">AEO Visibility Mini-Check</h1>
    <p class="claim" data-oid="cover.subtitle">Free 20-probe sampler plus 5 fixes</p>
    <ul class="chips"><li>dentist, plumber, agency, SaaS x 5</li><li>5 highest-leverage fixes</li><li>Honest method box: search proxy</li></ul>
    <span class="cta" data-oid="cover.cta">Free: $0 or donate</span>
  </div>
  <div class="art">
    <div class="blob"></div>
    <div class="paper"><div class="vp"><img src="assets/banks.png" alt="Probe questions: dentist, plumber, agency, SaaS"></div></div>
    <div class="free">FREE</div>
    <div class="n n1"><b>20</b>probes</div><div class="n n2"><b>5</b>fixes</div>

  </div>
</div>
</body>
</html>
