<!DOCTYPE html>
<!-- templates/email/announce/page.html: one 600px launch or update email. Preheader, header, picture band, kicker and title, 3 short points, button, footer with the unsubscribe line. Table layout, every colour and font inline on the cell that uses it, no side-specific padding, so dir="rtl" mirrors. template.json sets inlineTokens: the tool swaps each token reference for its literal value when it stamps the mail copy. Slots and defaults: template.json. An empty HERO_IMAGE leaves the drawn band. -->
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* Helpers a mail client may drop without harm. Colour and type sit inline on the cells. */
  body { margin: 0; padding: 0; }
  table { border-spacing: 0; }
  td { padding: 0; }
  html[dir="rtl"] td, html[dir="rtl"] div, html[dir="rtl"] h1, html[dir="rtl"] p, html[dir="rtl"] a { font-family: var(--font-hebrew), var(--font-body) !important; }
  @media (max-width: 480px) {
    .pad { padding-inline: 22px !important; }
    .h1 { font-size: 28px !important; }
    .band { height: 170px !important; }
  }
</style>
</head>
<body data-oid="cover.hero" style="margin: 0; padding: 0; background-color: var(--bg-2);">

<div style="display: none; max-height: 0; overflow: hidden; mso-hide: all;">{{PREHEADER}}</div>

<table role="presentation" dir="{{DIR}}" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; background-color: var(--bg-2);">
  <tr>
    <td align="center" style="padding: 24px 0 0;">

      <table role="presentation" dir="{{DIR}}" width="600" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px; background-color: var(--bg); border-radius: 16px;">

        <!-- header -->
        <tr>
          <td class="pad" style="padding: 26px 36px 22px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
              <tr>
                <td width="100%" style="font-family: var(--font-display); font-size: 23px; line-height: 1.1; font-weight: 700; color: var(--ink);">{{BRAND}}</td>
                <td style="white-space: nowrap; font-family: var(--font-mono); font-size: 12px; line-height: 1.2; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);">{{LABEL}}</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- picture band: the drawn shapes are the empty state, a picture covers them -->
        <tr>
          <td class="pad" style="padding: 0 36px;">
            <div class="band" style="height: 216px; border-radius: 14px; background-color: var(--accent); background-image: url('{{HERO_IMAGE}}'), radial-gradient(circle at 84% 22%, color-mix(in srgb, var(--on-accent) 22%, var(--accent)) 0 86px, rgba(0, 0, 0, 0) 87px), radial-gradient(circle at 10% 118%, color-mix(in srgb, var(--on-accent) 12%, var(--accent)) 0 150px, rgba(0, 0, 0, 0) 151px), linear-gradient(118deg, rgba(0, 0, 0, 0) 0 54%, color-mix(in srgb, var(--on-accent) 12%, var(--accent)) 54% 63%, rgba(0, 0, 0, 0) 63%); background-size: cover; background-position: center; background-repeat: no-repeat; font-size: 1px; line-height: 1px;">&nbsp;</div>
          </td>
        </tr>

        <!-- kicker, title, intro -->
        <tr>
          <td class="pad" style="padding: 30px 36px 8px;">
            <div data-oid="cover.subtitle" style="font-family: var(--font-mono); font-size: 13px; line-height: 1.3; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink);">{{KICKER}}</div>
            <h1 class="h1" data-oid="cover.title" style="margin: 10px 0 14px; font-family: var(--font-display); font-size: 34px; line-height: 1.1; font-weight: 700; color: var(--ink); text-wrap: balance;">{{TITLE}}</h1>
            <p style="margin: 0; font-family: var(--font-body); font-size: 17px; line-height: 1.55; color: var(--muted);">{{INTRO}}</p>
          </td>
        </tr>

        <!-- three points -->
        <tr>
          <td class="pad" style="padding: 20px 36px 6px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
              <tr>
                <td width="46" valign="top" style="width: 46px; padding: 18px 0; border-top: 1px solid var(--chip-line);">
                  <div style="width: 30px; height: 30px; border-radius: 15px; background-color: var(--accent); color: var(--on-accent); font-family: var(--font-display); font-size: 15px; line-height: 30px; font-weight: 700; text-align: center;">1</div>
                </td>
                <td valign="top" style="padding: 18px 0; border-top: 1px solid var(--chip-line);">
                  <div style="font-family: var(--font-body); font-size: 17px; line-height: 1.35; font-weight: 700; color: var(--ink);">{{POINT_1_TITLE}}</div>
                  <div style="font-family: var(--font-body); font-size: 16px; line-height: 1.5; color: var(--muted);">{{POINT_1_TEXT}}</div>
                </td>
              </tr>
              <tr>
                <td width="46" valign="top" style="width: 46px; padding: 18px 0; border-top: 1px solid var(--chip-line);">
                  <div style="width: 30px; height: 30px; border-radius: 15px; background-color: var(--accent); color: var(--on-accent); font-family: var(--font-display); font-size: 15px; line-height: 30px; font-weight: 700; text-align: center;">2</div>
                </td>
                <td valign="top" style="padding: 18px 0; border-top: 1px solid var(--chip-line);">
                  <div style="font-family: var(--font-body); font-size: 17px; line-height: 1.35; font-weight: 700; color: var(--ink);">{{POINT_2_TITLE}}</div>
                  <div style="font-family: var(--font-body); font-size: 16px; line-height: 1.5; color: var(--muted);">{{POINT_2_TEXT}}</div>
                </td>
              </tr>
              <tr>
                <td width="46" valign="top" style="width: 46px; padding: 18px 0; border-top: 1px solid var(--chip-line); border-bottom: 1px solid var(--chip-line);">
                  <div style="width: 30px; height: 30px; border-radius: 15px; background-color: var(--accent); color: var(--on-accent); font-family: var(--font-display); font-size: 15px; line-height: 30px; font-weight: 700; text-align: center;">3</div>
                </td>
                <td valign="top" style="padding: 18px 0; border-top: 1px solid var(--chip-line); border-bottom: 1px solid var(--chip-line);">
                  <div style="font-family: var(--font-body); font-size: 17px; line-height: 1.35; font-weight: 700; color: var(--ink);">{{POINT_3_TITLE}}</div>
                  <div style="font-family: var(--font-body); font-size: 16px; line-height: 1.5; color: var(--muted);">{{POINT_3_TEXT}}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- button -->
        <tr>
          <td class="pad" style="padding: 22px 36px 34px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="border-radius: 10px; background-color: var(--accent);">
                  <a class="cta" data-oid="cover.cta" href="{{CTA_URL}}" style="display: inline-block; padding: 15px 30px; border-radius: 10px; font-family: var(--font-body); font-size: 17px; line-height: 1.2; font-weight: 700; color: var(--on-accent); text-decoration: none;">{{CTA_LABEL}}</a>
                </td>
              </tr>
            </table>
            <p style="margin: 14px 0 0; font-family: var(--font-body); font-size: 14px; line-height: 1.5; color: var(--muted);">{{CTA_NOTE}}</p>
          </td>
        </tr>

      </table>

      <!-- footer with the unsubscribe line -->
      <table role="presentation" dir="{{DIR}}" width="600" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px;">
        <tr>
          <td class="pad" style="padding: 22px 36px 30px; font-family: var(--font-body); font-size: 13px; line-height: 1.6; color: var(--muted); text-align: center;">
            {{FOOT_REASON}}<br>
            {{FOOT_SENDER}}<br>
            {{UNSUB_TEXT}} <a href="{{UNSUB_URL}}" style="color: var(--ink); font-weight: 700; text-decoration: underline;">{{UNSUB_LABEL}}</a>
          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>

</body>
</html>
