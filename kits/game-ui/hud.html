<!DOCTYPE html>
<!-- kits/game-ui/hud.html (DS-11): HUD slice. Imports tokens.css + buttons.css. Icons: inline Lucide-style stroke SVGs (ISC), 24x24 stroke=currentColor. Art placeholders: CSS shapes (Kenney CC0 idea, no binaries). -->
<html lang="en" dir="ltr" data-engine="forge engine2040">
<head>
<meta charset="utf-8">
<title>HUD slice</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="buttons.css">
<style>
  body { margin: 0; background: var(--gui-bg); color: var(--gui-ink); font-family: var(--font-gui); }
  .hud { display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: var(--gui-panel); border-bottom: 2px solid var(--gui-line); }
  .bars { display: grid; gap: 6px; flex: 1; }
  .bar { height: 16px; border: 1px solid var(--gui-line); border-radius: 8px; overflow: hidden; background: var(--gui-bg); }
  .bar > i { display: block; height: 100%; }
  .hp > i { width: 72%; background: var(--gui-hp); }
  .mana > i { width: 48%; background: var(--gui-mana); }
  .score { font-family: var(--font-gui-display); font-size: 20px; color: var(--gui-accent); min-height: 44px; display: inline-flex; align-items: center; }
  .icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--gui-line); border-radius: 10px; background: var(--gui-bg); }
  .icon svg { width: 24px; height: 24px; }
  .muted { color: var(--gui-muted); font-size: 12px; }
</style>
</head>
<body>
  <div class="hud" data-engine="forge">
    <span class="icon" aria-label="health">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    </span>
    <div class="bars" data-gap="6">
      <div class="bar hp" role="img" aria-label="health 72 percent"><i></i></div>
      <div class="bar mana" role="img" aria-label="mana 48 percent"><i></i></div>
    </div>
    <span class="score">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      12,400
    </span>
    <span class="icon" aria-label="pause">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
    </span>
  </div>
  <p class="muted">HUD slice: health plus mana plus score plus pause. Min touch target 44px.</p>
</body>
</html>
